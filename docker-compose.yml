services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    # OAuth keys (GitHub/Google) - file is gitignored
    env_file:
      - ./backend/.env
    ports:
      - "8080:8080"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    depends_on:
      - backend

      