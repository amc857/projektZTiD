# Load local secrets from backend/.env if it exists (file is gitignored)
spring.config.import=optional:file:.env[.properties]


# H2 in-memory database (data resets on restart — sufficient for dev/demo)
spring.datasource.url=jdbc:h2:mem:ztiddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 console (dev only — disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# Server port
server.port=8080

# Session cookie: SameSite=Strict to mitigate CSRF
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

# OAuth 2.0 - "Log in with GitHub"
# Without them the app still starts; only the GitHub button won't work.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:not-configured}
# Least privilege: public profile only (login, id, avatar) - no repo access
spring.security.oauth2.client.registration.github.scope=read:user

# Where the browser lands after GitHub login (React dev server)
app.frontend.url=http://localhost:5173



