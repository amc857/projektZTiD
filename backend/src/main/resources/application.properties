# H2 in-memory database (data resets on restart — sufficient for dev/demo)
spring.datasource.url=jdbc:h2:mem:ztiddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 console (dev only — disable in production)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads

# Server port
server.port=8080

# Session cookie: SameSite=Strict to mitigate CSRF
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

