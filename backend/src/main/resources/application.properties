# H2 persistent file database (domyślnie w katalogu ./data, w Dockerze w /app/data)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/ztiddb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false

# H2 console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload settings
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=/app/uploads

# Server port
server.port=8080

# Session cookie
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

# OAuth 2.0 - GitHub
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.github.scope=read:user

# Frontend URL & JWT Secret
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET}